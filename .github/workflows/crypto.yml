name: Bot Crypto

# Déclencheurs : quand est-ce que le bot se lance ?
on:
  schedule:
    # '0 * * * *' signifie : à la minute 0 de chaque heure (toutes les heures)
    - cron: '0 * * * *'
  # Permet de lancer le bot manuellement depuis l'onglet Actions pour tester
  workflow_dispatch:

jobs:
  run-crypto:
    # On utilise un serveur Linux gratuit fourni par GitHub
    runs-on: ubuntu-latest
    
    steps:
      # Étape 1 : Récupérer votre code depuis le dépôt
      - name: Récupération du code
        uses: actions/checkout@v4

      # Étape 2 : Installer Python sur le serveur
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Étape 3 : Installer les bibliothèques nécessaires
      - name: Installation des dépendances
        run: pip install ccxt pandas ta requests biquote

      # Étape 4 : Lancer votre script avec vos Secrets
      - name: Lancement de l'analyse Crypto
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_crypto.py
