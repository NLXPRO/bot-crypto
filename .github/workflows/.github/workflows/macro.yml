name: Bot Macro

# Déclencheurs
on:
  schedule:
    # '*/5 * * * *' signifie : toutes les 5 minutes (le minimum autorisé par GitHub)
    - cron: '*/5 * * * *'
  # Permet de lancer manuellement pour tester
  workflow_dispatch:

jobs:
  run-macro:
    runs-on: ubuntu-latest
    
    steps:
      # Étape 1 : Récupérer votre code
      - name: Récupération du code
        uses: actions/checkout@v4

      # Étape 2 : Installer Python
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Étape 3 : Installer les bibliothèques nécessaires
      - name: Installation des dépendances
        run: pip install requests biquote

      # Étape 4 : Lancer votre script avec vos Secrets (n'oubliez pas la clé FRED ici)
      - name: Lancement de l'analyse Macro
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main_macro.py
